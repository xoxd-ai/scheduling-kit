name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    uses: xoxd-ai/ci-templates/.github/workflows/js-bazel-package.yml@v3.2.1
    with:
      runner_mode: repo_owned
      runner_labels_json: ${{ vars.PRIMARY_LINUX_RUNNER_LABELS_JSON }}
      workspace_mode: isolated
      # The shared package template defaults publication on. Its required
      # negative sentinel keeps this invocation validation-only; no provider
      # coordinate is supplied.
      npm_publish_mode: disabled
      node_versions: '["20", "22"]'
      pnpm_version: "9.15.9"
      prepare_command: pnpm exec svelte-kit sync
      metadata_check_command: pnpm check:release-metadata
      lint_command: pnpm lint
      typecheck_command: pnpm check
      unit_test_command: pnpm test:unit
      integration_test_command: pnpm test:integration
      build_command: pnpm build
      package_check_command: pnpm check:package
      bazel_targets: "//:typecheck //:pkg //:test"
      # Cache-first shared-cache-backed Bazel validation (TIN-2110 pilot).
      # Routes the Bazel validation through the fail-closed cache-attachment
      # contract + --config=ci-cached --remote_cache=$BAZEL_REMOTE_CACHE
      # (read-only, no executor). Endpoint is injected at runtime by the
      # in-cluster nix-setup; nothing is baked. Cache-first only.
      cache_backed: false
      package_dir: ./bazel-bin/pkg

  # Repo-local lane for the write-time double-booking proof (TIN-2764). The
  # reusable job above runs `pnpm test:integration` with no database, so the
  # homegrown concurrency suite skips there. This lane provisions PostgreSQL
  # from the repo's pinned flake on the same GF capability class as package CI;
  # it never falls back to a hosted runner or ARC service-container semantics.
  integration-postgres:
    name: Integration (GF PostgreSQL)
    runs-on: ${{ fromJSON(vars.PRIMARY_LINUX_RUNNER_LABELS_JSON) }}
    env:
      PGHOST: 127.0.0.1
      PGPORT: "55432"
      PGUSER: postgres
      PGDATABASE: scheduling_kit_test
      DATABASE_URL: postgres://postgres@127.0.0.1:55432/scheduling_kit_test
      PG_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: xoxd-ai/ci-templates/.github/actions/nix-setup@v3.2.1
      - uses: pnpm/action-setup@v4
        with:
          version: "9.15.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec svelte-kit sync
      - name: Run integration proof with pinned PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          export CI_NODE_BIN_DIR="$(dirname "$(command -v node)")"
          export CI_PNPM_BIN="$(command -v pnpm)"
          nix develop .#ci-postgres --command bash <<'POSTGRES_PROOF'
          set -euo pipefail
          export PATH="$CI_NODE_BIN_DIR:$(dirname "$CI_PNPM_BIN"):$PATH"
          # GF runner pods execute jobs as root, and initdb/postgres refuse to
          # run as root. Drop to an unprivileged account for the database
          # processes only; clients connect over TCP as the postgres role.
          PG_AS=()
          PG_ROOT_DIR="$RUNNER_TEMP"
          if [ "$(id -u)" -eq 0 ]; then
            PG_OS_USER=""
            for candidate in runner nobody; do
              if id "$candidate" >/dev/null 2>&1; then PG_OS_USER="$candidate"; break; fi
            done
            if [ -z "$PG_OS_USER" ]; then
              echo "::error::running as root and no unprivileged account (runner, nobody) exists for PostgreSQL"
              exit 1
            fi
            PG_ROOT_DIR="$(mktemp -d /tmp/scheduling-kit-pg.XXXXXX)"
            chown "$(id -u "$PG_OS_USER"):$(id -g "$PG_OS_USER")" "$PG_ROOT_DIR"
            PG_AS=(setpriv --reuid="$(id -u "$PG_OS_USER")" --regid="$(id -g "$PG_OS_USER")" --clear-groups --)
            echo "running PostgreSQL as $PG_OS_USER under $PG_ROOT_DIR"
          fi
          export PGDATA="$PG_ROOT_DIR/scheduling-kit-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PG_LOG="$PG_ROOT_DIR/scheduling-kit-postgres.log"
          ${PG_AS[@]+"${PG_AS[@]}"} initdb --username="$PGUSER" --auth=trust "$PGDATA"
          if ! ${PG_AS[@]+"${PG_AS[@]}"} pg_ctl -D "$PGDATA" -l "$PG_LOG" \
            -o "-h $PGHOST -p $PGPORT -k $PG_ROOT_DIR" -w start; then
            cat "$PG_LOG" || true
            exit 1
          fi
          trap '${PG_AS[@]+"${PG_AS[@]}"} pg_ctl -D "$PGDATA" -w stop -m fast >/dev/null 2>&1 || true' EXIT
          createdb --maintenance-db=postgres "$PGDATABASE"
          pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"
          "$CI_PNPM_BIN" test:integration
          POSTGRES_PROOF
